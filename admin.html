<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Courier Run moderation</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f1ea; color: #1b1730; margin: 0; padding: 16px; font-size: 17px; line-height: 1.45; }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 4px 0 8px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 17px; border-radius: 8px; border: 2px solid #6a5f95; }
  button { padding: 11px 16px; font-size: 16px; font-weight: 700; border-radius: 8px; border: 2px solid #6a5f95; background: #e2a23a; color: #1b1730; cursor: pointer; margin-top: 8px; }
  button.small { padding: 6px 10px; font-size: 14px; margin: 0; background: #fff; }
  .msg { min-height: 24px; font-weight: 700; margin: 10px 0; }
  .msg.err { color: #b3261e; } .msg.ok { color: #2f7a3a; }
  ul { list-style: none; padding: 0; margin: 12px 0; }
  li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; margin: 5px 0; background: #fff; border-radius: 8px; border: 1px solid #d8d2c4; }
  li.hidden { opacity: 0.6; background: #eee; }
  .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 700; }
  .sc { flex: none; }
  .st { flex: none; font-size: 13px; color: #6d6252; width: 52px; }
</style>
</head>
<body>
<main>
  <h1>Courier Run moderation</h1>
  <p>Enter your admin key to see the leaderboard and hide any name that should not be there. Hidden players can carry on playing but stay off the board until you bring them back.</p>
  <label for="key">Admin key</label>
  <input id="key" type="password" autocomplete="off">
  <button id="load" type="button">Show the leaderboard</button>
  <div class="msg" id="msg" role="status"></div>
  <ul id="list"></ul>
</main>
<script>
(function () {
  var key = '';
  var $ = function (id) { return document.getElementById(id); };
  function say(t, kind) { var m = $('msg'); m.textContent = t; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function call(body) {
    return fetch('/.netlify/functions/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  }
  function show(entries) {
    var ul = $('list'); ul.textContent = '';
    if (!entries.length) { say('The board is empty.', 'ok'); return; }
    entries.forEach(function (e, i) {
      var li = document.createElement('li'); if (e.hidden) li.className = 'hidden';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = (i + 1) + '. ' + e.name;
      var sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = String(e.score);
      var st = document.createElement('span'); st.className = 'st'; st.textContent = e.hidden ? 'hidden' : 'shown';
      var b = document.createElement('button'); b.className = 'small'; b.type = 'button'; b.textContent = e.hidden ? 'Show' : 'Hide';
      b.addEventListener('click', function () {
        b.disabled = true;
        call({ key: key, action: e.hidden ? 'unhide' : 'hide', name: e.name }).then(function (j) {
          if (j.ok) load(); else { b.disabled = false; say('That did not work.', 'err'); }
        }).catch(function () { b.disabled = false; say('Could not reach the server.', 'err'); });
      });
      li.appendChild(nm); li.appendChild(sc); li.appendChild(st); li.appendChild(b);
      ul.appendChild(li);
    });
  }
  function load() {
    key = $('key').value;
    if (!key) { say('Type your admin key first.', 'err'); return; }
    say('Loading...');
    call({ key: key, action: 'list' }).then(function (j) {
      if (j._status === 503) say('No admin key is set on the server yet (it must be at least 12 characters). See the README.', 'err');
      else if (j._status === 401) say('That key is not right.', 'err');
      else if (j.entries) { say('Showing the top ' + j.entries.length + '.', 'ok'); show(j.entries); }
      else say('Something went wrong.', 'err');
    }).catch(function () { say('Could not reach the server.', 'err'); });
  }
  $('load').addEventListener('click', load);
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
})();
</script>
</body>
</html>
